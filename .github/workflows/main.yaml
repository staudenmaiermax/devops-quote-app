name: DevOps Quote App CI/CD

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Code auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python auf dem Runner einrichten
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. SYNTAX-CHECK
      - name: Check Python Syntax
        run: |
          python -m py_compile app.py

      # 4. Bei Docker Hub anmelden (mit deinen Secrets)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker Image bauen und zu Docker Hub pushen
      # ACHTUNG: Ersetze 'DEIN_DOCKERHUB_BENUTZERNAME' unten mit deinem echten Usernamen!
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            daymolockg/devops-quote-app:latest
            daymolockg/devops-quote-app:${{ github.sha }}